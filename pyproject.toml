[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marak"
version = "0.5.1a1"
description = "Marak Core compiler implementation workstream"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
marak = "compiler.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["compiler*"]
