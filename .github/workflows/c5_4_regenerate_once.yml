name: C5.4 Canonical Regeneration One-Shot

on:
  push:
    branches:
      - workstream-c/c5-4-exact-counted-recurrence

permissions:
  contents: write

jobs:
  regenerate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: workstream-c/c5-4-exact-counted-recurrence
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Regenerate canonical registry and artifacts
        run: |
          python tools/regenerate_current_artifacts.py
          python tools/dump_current_registry.py
      - name: Commit generated canonical bytes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spec/CURRENT_CONSTRUCTION_REGISTRY.json artifacts/*.cbh-artifact.json
          if git diff --cached --quiet; then
            echo "No canonical-byte changes."
            exit 0
          fi
          git commit -m "C5.4 regenerate canonical registry and artifacts"
          git push origin HEAD:workstream-c/c5-4-exact-counted-recurrence
