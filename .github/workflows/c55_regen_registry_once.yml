name: C5.5 registry regeneration after composition

on:
  push:
    branches:
      - workstream-c/c5-5-program-input-binding

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message != 'C5.5 regenerate registry after recurrence composition'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: workstream-c/c5-5-program-input-binding
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Regenerate canonical registry and artifacts
        run: |
          python tools/regenerate_current_artifacts.py
          python tools/dump_current_registry.py
      - name: Commit canonical bytes if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spec/CURRENT_CONSTRUCTION_REGISTRY.json artifacts
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "C5.5 regenerate registry after recurrence composition"
            git push origin HEAD:workstream-c/c5-5-program-input-binding
          fi
