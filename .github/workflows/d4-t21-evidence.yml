name: D4 T21 Evidence

on:
  push:
    branches:
      - workstream-d/d4-post-c56-megillah-conformance

permissions:
  contents: read

jobs:
  d4-t21-end-to-end-evidence:
    name: D4 T21 E2E (${{ matrix.side }}, ${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        side: [after, before]
        runtime: [hast, ir, portable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Verify immutable T21 candidate
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          p=Path("megillah/candidates/Megilat_HaItim_Marak_Candidate.md")
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          expected="6fda03c4ca953898b471da666c048d81020f9bea4fcd240b94aab7bb3f091881"
          print(got)
          assert got == expected
      - name: Run one full production runtime
        run: >-
          python tests/d4_t21_end_to_end_evidence.py
          --side ${{ matrix.side }}
          --runtime ${{ matrix.runtime }}
          --output evidence-${{ matrix.side }}-${{ matrix.runtime }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: d4-t21-e2e-${{ matrix.side }}-${{ matrix.runtime }}
          path: evidence-${{ matrix.side }}-${{ matrix.runtime }}.json
          if-no-files-found: error

  d4-t21-end-to-end-compare:
    name: D4 T21 E2E exact three-runtime agreement
    needs: d4-t21-end-to-end-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: d4-t21-e2e-*
          path: evidence
          merge-multiple: true
      - name: Require exact HAST/IR/portable agreement
        run: python tests/d4_t21_end_to_end_compare.py
