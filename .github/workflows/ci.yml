name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest
      - run: python -m pip install -e .
      - run: python -m pytest -q
      - run: python spec/surface/tools/a13_selftest.py
      - run: python spec/semantics/run_all.py

  tooling-portability:
    name: Tooling portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_current_registry_tool.py
      - name: Report canonical registry SHA-256
        run: python -c "from pathlib import Path; import hashlib; p=Path('spec/CURRENT_CONSTRUCTION_REGISTRY.json'); print(hashlib.sha256(p.read_bytes()).hexdigest())"
      - run: git diff --exit-code -- spec/CURRENT_CONSTRUCTION_REGISTRY.json spec/A0_CONSTRUCTION_REGISTRY.json

  domain-infrastructure:
    name: C5.1 domain infrastructure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_c5_1_domain_infrastructure.py tests/test_m4_ir_artifact_backend.py tests/test_m4_occurrence_results.py

  c5-2:
    name: C5.2 Symbol/Index/Ordering (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pip install -e .
      - run: python -m pytest -q tests/test_c5_2_surface_pipeline.py tests/test_c5_2_numerals.py tests/test_c5_2_artifact_adversarial.py tests/test_c5_2_portability.py tests/test_c5_2_scope_guard.py
      - name: Run C5.2 required proposal regressions
        run: |
          python spec/surface/tools/a13_selftest.py
          python spec/semantics/run_all.py
          python spec/proposals/a15/tools/run_a15_surface_tests.py
          python spec/proposals/b13/reference/run_reference_tests.py
          python spec/proposals/b14/reference/run_b14_integration_tests.py
          python spec/proposals/a16/reference/run_a16_surface_tests.py
          python spec/proposals/b15/reference/run_b15_tests.py
          python spec/proposals/a17/reference/run_a17_surface_tests.py
          python tools/run_c5_6_b16_semantic_regressions.py
          python -m pytest -q spec/proposals/b16/reference/test_b16_required_regressions.py
          python spec/proposals/a17/reference/run_a17_surface_tests.py
          python tools/run_c5_6_b16_semantic_regressions.py
          python -m pytest -q spec/proposals/b16/reference/test_b16_required_regressions.py
      - run: python tools/dump_current_registry.py
      - run: git diff --exit-code -- spec/CURRENT_CONSTRUCTION_REGISTRY.json

  c5-3:
    name: C5.3 Finite Ordered Collections (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pip install -e .
      - run: python -m pytest -q tests/test_c5_3_collections.py tests/test_c5_3_artifact_adversarial.py tests/test_c5_3_scope_guard.py
      - name: Run full C5.3 regression suite
        run: python -m pytest -q
      - name: Run C5.3 required proposal regressions
        run: |
          python spec/surface/tools/a13_selftest.py
          python spec/semantics/run_all.py
          python spec/proposals/a15/tools/run_a15_surface_tests.py
          python spec/proposals/b13/reference/run_reference_tests.py
          python spec/proposals/b14/reference/run_b14_integration_tests.py
          python spec/proposals/a16/reference/run_a16_surface_tests.py
          python spec/proposals/b15/reference/run_b15_tests.py
      - name: Report C5.3 resource sanity
        run: python tools/c5_3_resource_sanity.py
      - name: Regenerate C5.3 canonical bytes
        if: always()
        run: |
          python tools/regenerate_current_artifacts.py
          python tools/dump_current_registry.py
      - name: Report C5.3 generated hashes
        if: always()
        run: |
          python -c "from pathlib import Path; import hashlib; print('registry',hashlib.sha256(Path('spec/CURRENT_CONSTRUCTION_REGISTRY.json').read_bytes()).hexdigest()); [print(p.as_posix(),hashlib.sha256(p.read_bytes()).hexdigest()) for p in sorted(Path('artifacts').glob('*.cbh-artifact.json'))]"
      - name: Upload C5.3 generated canonical bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c5-3-generated-${{ matrix.os }}
          path: |
            spec/CURRENT_CONSTRUCTION_REGISTRY.json
            artifacts/*.cbh-artifact.json
      - name: Verify committed C5.3 canonical bytes
        if: always()
        run: git diff --exit-code -- spec/CURRENT_CONSTRUCTION_REGISTRY.json artifacts


  c5-4:
    name: C5.4 Exact Counted Recurrence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pip install -e .
      - name: Run C5.4 targeted source/artifact/scope tests
        run: python -m pytest -q tests/test_c5_4_recurrence.py tests/test_c5_4_artifact_adversarial.py tests/test_c5_4_scope_guard.py
      - name: Run full C5.4 regression suite
        run: python -m pytest -q
      - name: Run C5.4 required proposal regressions
        run: |
          python spec/surface/tools/a13_selftest.py
          python spec/semantics/run_all.py
          python spec/proposals/a15/tools/run_a15_surface_tests.py
          python spec/proposals/b13/reference/run_reference_tests.py
          python spec/proposals/b14/reference/run_b14_integration_tests.py
          python spec/proposals/a16/reference/run_a16_surface_tests.py
          python spec/proposals/b15/reference/run_b15_tests.py
      - name: Report C5.4 finite-count resource sanity
        run: python tools/c5_4_resource_sanity.py
      - name: Regenerate C5.4 canonical bytes
        if: always()
        run: |
          python tools/regenerate_current_artifacts.py
          python tools/dump_current_registry.py
      - name: Report C5.4 generated hashes
        if: always()
        run: |
          python -c "from pathlib import Path; import hashlib; print('registry',hashlib.sha256(Path('spec/CURRENT_CONSTRUCTION_REGISTRY.json').read_bytes()).hexdigest()); [print(p.as_posix(),hashlib.sha256(p.read_bytes()).hexdigest()) for p in sorted(Path('artifacts').glob('*.cbh-artifact.json'))]"
      - name: Upload C5.4 generated canonical bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c5-4-generated-${{ matrix.os }}
          path: |
            spec/CURRENT_CONSTRUCTION_REGISTRY.json
            artifacts/*.cbh-artifact.json
      - name: Verify committed C5.4 canonical bytes
        if: always()
        run: git diff --exit-code -- spec/CURRENT_CONSTRUCTION_REGISTRY.json artifacts


  c5-5:
    name: C5.5 Program Input Binding (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pip install -e .
      - name: Run C5.5 targeted source/invocation/artifact/scope tests
        run: python -m pytest -q tests/test_c5_5_program_inputs.py tests/test_c5_5_typed_inputs.py tests/test_c5_5_symbol_input_canonicality.py tests/test_c5_5_source_contract.py tests/test_c5_5_artifact_adversarial.py tests/test_c5_5_scope_guard.py
      - name: Run full C5.5 regression suite
        run: python -m pytest -q
      - name: Run C5.5 required proposal regressions
        run: |
          python spec/surface/tools/a13_selftest.py
          python spec/semantics/run_all.py
          python spec/proposals/a15/tools/run_a15_surface_tests.py
          python spec/proposals/b13/reference/run_reference_tests.py
          python spec/proposals/b14/reference/run_b14_integration_tests.py
          python spec/proposals/a16/reference/run_a16_surface_tests.py
          python spec/proposals/b15/reference/run_b15_tests.py
      - name: Report C5.5 input resource sanity
        run: python tools/c5_5_resource_sanity.py
      - name: Regenerate C5.5 canonical bytes
        if: always()
        run: |
          python tools/regenerate_current_artifacts.py
          python tools/dump_current_registry.py
      - name: Report C5.5 generated hashes
        if: always()
        run: |
          python -c "from pathlib import Path; import hashlib; print('registry',hashlib.sha256(Path('spec/CURRENT_CONSTRUCTION_REGISTRY.json').read_bytes()).hexdigest()); [print(p.as_posix(),hashlib.sha256(p.read_bytes()).hexdigest()) for p in sorted(Path('artifacts').glob('*.cbh-artifact.json'))]"
      - name: Upload C5.5 generated canonical bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c5-5-generated-${{ matrix.os }}
          path: |
            spec/CURRENT_CONSTRUCTION_REGISTRY.json
            artifacts/*.cbh-artifact.json
      - name: Verify committed C5.5 canonical bytes
        if: always()
        run: git diff --exit-code -- spec/CURRENT_CONSTRUCTION_REGISTRY.json artifacts

  c5-6:
    name: C5.6 General BidirectionalIndex Surface (${{ matrix.os }})
    env:
      PYTHONPATH: .
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pip install -e .
      - name: Run C5.6 targeted source/semantic/artifact/scope tests
        run: python -m pytest -q tests/test_c5_6_general_index_surface.py tests/test_c5_6_negative_scope.py tests/test_c5_6_artifact_adversarial.py tests/test_c5_6_scope_guard.py
      - name: Run full C5.6 regression suite
        run: python -m pytest -q
      - name: Run C5.6 required proposal regressions
        run: |
          python spec/surface/tools/a13_selftest.py
          python spec/semantics/run_all.py
          python spec/proposals/a15/tools/run_a15_surface_tests.py
          python spec/proposals/b13/reference/run_reference_tests.py
          python spec/proposals/b14/reference/run_b14_integration_tests.py
          python spec/proposals/a16/reference/run_a16_surface_tests.py
          python spec/proposals/a17/reference/run_a17_surface_tests.py
          python spec/proposals/b15/reference/run_b15_tests.py
          python tools/run_c5_6_b16_semantic_regressions.py
          python -m pytest -q spec/proposals/b16/reference/test_b16_required_regressions.py
      - name: Run frozen Megillah regressions
        run: python -m pytest -q tests/test_d3_megillah_repairs.py tests/test_d4_megillah_conformance.py tests/test_d4_post_c56_megillah.py tests/test_d4_post_c56_megillah.py
      - name: Regenerate C5.6 canonical bytes
        if: always()
        run: |
          python tools/regenerate_current_artifacts.py
          python tools/dump_current_registry.py
      - name: Report C5.6 generated hashes
        if: always()
        run: |
          python -c "from pathlib import Path; import hashlib; print('registry',hashlib.sha256(Path('spec/CURRENT_CONSTRUCTION_REGISTRY.json').read_bytes()).hexdigest()); [print(p.as_posix(),hashlib.sha256(p.read_bytes()).hexdigest()) for p in sorted(Path('artifacts').glob('*.cbh-artifact.json'))]"
      - name: Upload C5.6 generated canonical bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c5-6-generated-${{ matrix.os }}
          path: |
            spec/CURRENT_CONSTRUCTION_REGISTRY.json
            artifacts/*.cbh-artifact.json
      - name: Verify committed C5.6 canonical bytes
        if: always()
        run: git diff --exit-code -- spec/CURRENT_CONSTRUCTION_REGISTRY.json artifacts

  d4-megillah:
    name: D4 Megillah conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pip install -e .
      - name: Verify immutable historical original
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          p=Path("megillah/original/Megilat_HaItim_Yehuda_FINAL_2026-09-18.md")
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          expected="7b834f4a444e021bb65164282b851af960a6dbc0be3d458c2412181773b9db7b"
          print(got)
          assert got == expected
      - name: Run D3 and D4 Megillah tests
        run: python -m pytest -q tests/test_d3_megillah_repairs.py tests/test_d4_megillah_conformance.py
      - name: Measure current Megillah compiler frontier
        run: python tools/d4_frontier_probe.py
      - name: Run post-M2 proposal regressions
        run: |
          python spec/surface/tools/a13_selftest.py
          python spec/semantics/run_all.py
          python spec/proposals/a15/tools/run_a15_surface_tests.py
          python spec/proposals/b13/reference/run_reference_tests.py
          python spec/proposals/b14/reference/run_b14_integration_tests.py
          python spec/proposals/a16/reference/run_a16_surface_tests.py
          python spec/proposals/b15/reference/run_b15_tests.py
